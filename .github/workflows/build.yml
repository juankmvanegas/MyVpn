name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./internal/... ./cmd/...
      - run: go test -race ./internal/... ./cmd/...
      - name: Linux TUN integration (Docker)
        run: ./scripts/test-linux-docker.sh

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*macos*

  windows-build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: sudo apt-get install -y zip
      - run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/*windows*

  # Firma Authenticode (necesaria para Control inteligente de aplicaciones de
  # Windows 11). Usa Azure Artifact Signing si los secretos están configurados;
  # si no, publica los binarios sin firmar. Ver docs/firma-windows.md.
  windows-sign:
    needs: windows-build
    runs-on: windows-2022
    env:
      SIGNING_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned
      - name: Descomprimir
        shell: pwsh
        run: |
          Get-ChildItem unsigned\*.zip | ForEach-Object {
            Expand-Archive $_.FullName -DestinationPath ("stage\" + $_.BaseName)
          }
      - name: Firmar con Azure Artifact Signing
        if: env.SIGNING_CONFIGURED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\stage
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-digest: SHA256
          description: MyVpn
          description-url: https://github.com/${{ github.repository }}
      - name: Verificar firmas y volver a empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          foreach ($d in Get-ChildItem stage -Directory) {
            foreach ($exe in Get-ChildItem $d.FullName -Filter *.exe) {
              $sig = Get-AuthenticodeSignature $exe.FullName
              "{0}\{1}: {2} {3}" -f $d.Name, $exe.Name, $sig.Status, $sig.SignerCertificate.Subject
              if ($env:SIGNING_CONFIGURED -eq 'true' -and $sig.Status -ne 'Valid') { throw "firma inválida en $($exe.Name)" }
            }
            Compress-Archive -Path "$($d.FullName)\*" -DestinationPath "dist\$($d.Name).zip"
          }
          if ($env:SIGNING_CONFIGURED -ne 'true') { "::warning::Binarios de Windows SIN firmar: configura la firma (docs/firma-windows.md)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*windows*

  windows-integration:
    needs: windows-sign
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - shell: pwsh
        run: ./scripts/windows-integration.ps1

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: ARCHS=${{ matrix.arch }} ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*linux*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-integration, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum MyVpn-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          overwrite_files: true
